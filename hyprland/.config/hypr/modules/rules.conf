# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Calculator Float Rule
windowrule = float 1, match:class ^(org\.gnome\.Calculator)$
windowrule = size 350 250, match:class ^(org\.gnome\.Calculator)$
windowrule = center 1, match:class ^(org\.gnome\.Calculator)$

# Calculator Bravo Rule
windowrule = workspace special:bravo, match:class ^(org\.gnome\.Calculator)$
windowrule = move 50 200, match:class ^(org\.gnome\.Calculator)$